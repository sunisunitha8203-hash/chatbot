<!DOCTYPE html>
<html>
<head>

<title>Chat History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">
📜 Chat History
</h2>

<a href="/chat" class="btn btn-primary mb-3">
← Back to Chat
</a>

{% if chats %}

{% for chat in chats %}

<div class="card mb-3 shadow">

<div class="card-body">

<h5 class="text-primary">
 {{ chat[0] }}?
</h5>

<button
class="btn btn-success btn-sm"
onclick="document.getElementById('answer{{ loop.index }}').style.display='block'; this.style.display='none';">
View Answer
</button>

<div
id="answer{{ loop.index }}"
style="display:none; margin-top:15px; background:#f8f9fa; padding:15px; border-radius:10px;">

<b>🤖 AI Answer</b>

<hr>

<p style="white-space:pre-wrap;">
{{ chat[1]
|replace('<','&lt;')
|replace('>','&gt;')
|replace('#','')
|replace('**','')
|replace('##','')
|replace('*','')
|replace('`','')
}}
</p>

</div>

</div>

</div>

{% endfor %}

<div class="alert alert-warning">

No chat history found.

</div>

{% endif %}

</div>

</body>
</html>
