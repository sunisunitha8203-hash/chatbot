<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Doubt Chatbot</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.navbar{
    background:#0d6efd;
}

.chat-box{
    height:500px;
    overflow-y:auto;
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
}

.bot{
    background:#e9f5ff;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.user{
    background:#d1ffd6;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:right;
}

.input-box{
    margin-top:20px;
}
.bot-answer h1,
.bot-answer h2,
.bot-answer h3{
    color:#0d6efd;
    margin-top:10px;
}

.bot-answer p{
    margin-bottom:10px;
}

.bot-answer ul{
    padding-left:20px;
}

.bot-answer li{
    margin-bottom:5px;
}

.bot-answer strong{
    color:#198754;
}

.bot-answer code{
    background:#f4f4f4;
    padding:2px 5px;
    border-radius:5px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">
<div class="container">

<a class="navbar-brand" href="/">🎓 Student Doubt Chatbot</a>

<div>
    <a href="/chat" class="btn btn-light btn-sm">Chat</a>
    <a href="/history" class="btn btn-warning btn-sm">History</a>
    <a href="/profile" class="btn btn-info btn-sm">Profile</a>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</div>

</div>
</nav>

</div>
</nav>

<div class="container mt-5">

<div class="chat-box" id="chatBox">

<div class="bot">
<b>AI Tutor 🤖</b><br>
Hello! 👋<br>
Ask me any programming or academic doubt.
</div>

</div>

<div class="input-box">

<div class="input-group">

<input
type="text"
id="question"
class="form-control"
placeholder="Type your question here..."
onkeypress="if(event.key==='Enter'){sendMessage()}">

<button
class="btn btn-primary"
onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>

<script>

async function sendMessage(){

    let question = document.getElementById("question").value.trim();

    if(question=="")
        return;

    let chat = document.getElementById("chatBox");

    // Show user's message
    chat.innerHTML += `
    <div class="user">
        <b>You 👨‍🎓</b><br>
        ${question}
    </div>
    `;

    document.getElementById("question").value="";

    // Loading message
    chat.innerHTML += `
    <div class="bot" id="loading">
        🤖 Thinking...
    </div>
    `;

    chat.scrollTop = chat.scrollHeight;

    try{

        const response = await fetch("/ask",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                question:question
            })
        });

        const data = await response.json();

        // Remove loading
        document.getElementById("loading").remove();

        // Show AI answer
        chat.innerHTML += `
        <div class="bot">
            <b>AI Tutor 🤖</b><br>
            <div class="bot-answer">
                ${data.answer}
            </div>
        </div>
        `;

        chat.scrollTop = chat.scrollHeight;

    }
    catch(error){

        document.getElementById("loading").remove();

        chat.innerHTML += `
        <div class="bot">
            ❌ Error connecting to AI.
        </div>
        `;
    }

}

</script>

</body>
</html>
