<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
font-family:Arial;
}

.register-box{

max-width:500px;
margin:40px auto;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0px 5px 15px gray;

}

h2{

text-align:center;

margin-bottom:20px;

color:#0d6efd;

}

</style>

</head>

<body>

<div class="register-box">

<h2>🎓 Student Registration</h2>

<form method="POST" action="/register">

<div class="mb-3">

<label>Full Name</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter your name"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

<button
class="btn btn-success w-100">

Register

</button>

</form>

<br>

<p class="text-center">

Already have an account?

<a href="/login">

Login

</a>

</p>

</div>

</body>

</html>
