<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:420px;
            background:#fff;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .logo{
            text-align:center;
            font-size:60px;
            margin-bottom:10px;
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:30px;
            font-weight:bold;
        }

        .btn-login{
            width:100%;
            border-radius:30px;
            padding:10px;
            font-size:18px;
        }

        .register{
            text-align:center;
            margin-top:20px;
        }
    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        🎓
    </div>

    <h2>Student Login</h2>

    <form method="POST" action="/login">

        <div class="mb-3">
            <label class="form-label">Email</label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required>
        </div>

        <button
            type="submit"
            class="btn btn-primary btn-login">
            Login
        </button>

    </form>

    <div class="register">
        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>
    </div>

</div>

</body>
</html>
