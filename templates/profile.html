<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#f4f6f9;

}

.navbar{

background:#0d6efd;

}

.profile-card{

max-width:600px;

margin:40px auto;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,0.1);

}

h2{

text-align:center;

color:#0d6efd;

margin-bottom:30px;

}

.info{

font-size:18px;

margin-bottom:15px;

}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand" href="/chat">

🎓 Student Doubt Chatbot

</a>

<div>

<a href="/chat" class="btn btn-light btn-sm">

Chat

</a>

<a href="/history" class="btn btn-warning btn-sm">

History

</a>

<a href="/logout" class="btn btn-danger btn-sm">

Logout

</a>

</div>

</div>

</nav>

<div class="profile-card">

<h2>

👤 Student Profile

</h2>

<div class="info">

<b>Name :</b>

{{ student[0] }}

</div>

<div class="info">

<b>Email :</b>

{{ student[1] }}

</div>

<div class="info">

<b>Total Questions :</b>

{{ total }}

</div>

</div>

</body>

</html>
